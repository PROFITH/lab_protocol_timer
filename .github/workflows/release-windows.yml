name: Windows build and release

# On a pull request: builds the Windows app and keeps the installer as an
# artifact of the run (checks that the C++ of the plugins compiles).
# On a tag v* (or by hand, typing the tag): also attaches the installer and
# the portable zip to the GitHub release of that tag.
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the release (e.g. v1.4.1); created on this commit if it does not exist'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version from pubspec.yaml
        id: version
        shell: bash
        run: |
          v=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "lab_protocol_timer_${{ steps.version.outputs.version }}_windows.zip"

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=${{ steps.version.outputs.version }} windows/installer/lab_protocol_timer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: lab_protocol_timer_${{ steps.version.outputs.version }}_windows
          path: |
            lab_protocol_timer_*_windows.zip
            build/installer/*.exe
          retention-days: 30

      - name: Attach to the release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: lab_protocol_timer ${{ github.event.inputs.tag || github.ref_name }}
          body: See CHANGELOG.md. Install with lab_protocol_timer_setup_${{ steps.version.outputs.version }}.exe, or unzip the portable zip and run lab_protocol_timer.exe.
          files: |
            lab_protocol_timer_*_windows.zip
            build/installer/*.exe
